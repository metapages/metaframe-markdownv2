<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8"/>
    <base target="_parent"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Metaframe Markdown</title>
    <style>
      body,
      html {
        width: 100%;
        height: 100%;
        margin: 0;
        border: 0;
        /* No floating content on sides */
        display: block;
        background: none transparent;
      }

      .transparent {
        background: none transparent;
      }

      /* apply a natural box layout model to all elements, but allowing components to change */
      /* https://www.paulirish.com/2012/box-sizing-border-box-ftw/ */
      html {
        box-sizing: border-box;
      }

      *,
      *:after,
      *:before {
        box-sizing: inherit;
      }

      #menu-button {
        position: absolute;
        top: 10px;
        left: calc(100vw - 90px);
        z-index: 1000;
        background-color: #f9f9f9;
        border: 0;
        padding: 0;
        margin: 0;
        width: 80px;
        height: 30px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        border: 1px solid #e0e0e0;
        border-radius: 3px;
        color: #818382;
        font-family: monospace;
        padding: 8px;
      }

      @media (max-width: 768px) {
        #menu-button {
          width: 120px;
          height: 52px;
          font-size: 18px;
          left: calc(100vw - 132px);
          top: 8px;
          border-radius: 8px;
          padding: 12px;
          gap: 8px;
        }

        #menu-button svg {
          width: 24px;
          height: 24px;
        }

        .editor-container-shown {
          width: 100vw !important;
          max-width: 100vw !important;
        }

        .root-with-editor {
          display: none !important;
        }

        /* Editor is full-width on mobile, so there is no boundary to drag. */
        #editor-resize-handle {
          display: none !important;
        }
      }

      .editor-container-hidden {
        position: absolute;
        display: flex;
        width: 0;
        height: 0;
      }

      .editor-container-shown {
        position: absolute;
        display: flex;
        width: 100vw;
        height: 100vh;
        z-index: 3;
        right: 0;
        max-width: 100vw;
        min-width: 10ch;
      }

      .root {
        position: absolute;
        width: 100%;
        max-width: 100%;
        height: 100%;
        overflow: auto;
      }

      .root-with-editor {
        position: absolute;
        top: 0;
        height: 100vh;
        max-height: 100vh;
        z-index: 2;
        /* Long documents must still scroll while the editor is open */
        overflow: auto;
        max-width: calc(100vw - 10ch);
        min-width: 0;
      }

      /**
       * Special handling of iframes for ensuring the metaframe is correctly maximized.
       */

      .iframe-container {
        position: absolute;
        width: 100%;
        min-width: 100%;
      }

      .iframe-container iframe {
        border-width: 0;
        overflow: hidden;
        min-height: 100vh;
        max-height: 100%;
        left: 0;
        position: absolute;
        top: 0;
        width: 100%;
      }

      /* Base style for <pre> blocks */
      .pre-stdout {
        background-color: #f8f8f8;
        /* light grey background */
        /* border: 3px solid yellow;  */
        border-left: 3px solid #000;
        /* teal accent on the left */
        /* padding: 10px; */
        overflow: auto;
        /* in case of overflow */
        font-family: "Courier New", Courier, monospace;
        /* monospaced font */
        white-space: pre-wrap;
        /* wrap white-space */
        word-wrap: break-word;
        /* break long words */
        margin: 0;
      }

      /* Style for stderr to make it stand out */
      .pre-stderr {
        background-color: #fff0f0;
        /* light red background */
        /* border: 1px solid #ffcccc; light red border */
        border-left: 3px solid #e53935;
        /* darker red accent on the left */
        color: #d32f2f;
        /* darker red text color */
        /* padding: 10px; */
        overflow: auto;
        /* in case of overflow */
        font-family: "Courier New", Courier, monospace;
        /* monospaced font */
        white-space: pre-wrap;
        /* wrap white-space */
        word-wrap: break-word;
        /* break long words */
        margin: 0;
      }

      /* .borderFatSolidGreen {
        border: 5px solid green;
      }

      .borderDashedPurple {
        border: 4px dashed purple;
      }

      .borderDashedRed {
        border: 2px dashed red;
      }

      .borderDashedBlue {
        border: 2px dashed blue;
      } */

      .invisible-until-hover {
        opacity: 0;
        /* Make the element fully transparent initially */
        transition: opacity 0.3s;
        /* Optional: Smooth transition for the opacity change */
      }

      .invisible-until-hover:hover {
        opacity: 1;
        /* Make the element fully opaque (visible) when hovered */
      }

      /**
       * Draggable divider between the rendered output (#root) and the editor
       * pane (#editor-root). It sits on the boundary — its `right` offset is kept
       * in sync with the editor width in JS. This is also the escape hatch when
       * the editor is set too narrow to reach the width setting: the strip is
       * always grabbable regardless of how narrow the editor is.
       */
      #editor-resize-handle {
        position: absolute;
        top: 0;
        height: 100vh;
        width: 10px;
        z-index: 4;
        cursor: col-resize;
        display: none;
        background: transparent;
        /* `right` is set in JS to match the current editor width */
      }

      #editor-resize-handle::after {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        height: 100%;
        width: 1px;
        background: #d0d0d0;
        transition: background 0.15s, width 0.15s;
      }

      /* Little horizontal caps at the very top and bottom that close the gap
         between the divider's vertical line (this handle's center) and the
         editor pane's left border (this handle's right edge). A single box
         spanning that gap with only top/bottom borders draws both caps. */
      #editor-resize-handle::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        right: 0;
        height: 100%;
        border-top: 1px solid #d0d0d0;
        border-bottom: 1px solid #d0d0d0;
        pointer-events: none;
      }

      #editor-resize-handle:hover::after,
      #editor-resize-handle.dragging::after {
        background: #2563eb;
        width: 3px;
      }

      /* While dragging: show the resize cursor everywhere and stop the editor
         iframe / output from swallowing the mousemove events. */
      body.resizing {
        cursor: col-resize;
        user-select: none;
      }

      body.resizing #editor-root,
      body.resizing #root {
        pointer-events: none;
      }
    </style>
    <script src=" https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js "></script>
  </head>

  <body>
    <button id="menu-button" class="invisible-until-hover">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="#818382" viewbox="0 0 256 256">
        <path d="M227.31,73.37,182.63,28.68a16,16,0,0,0-22.63,0L36.69,152A15.86,15.86,0,0,0,32,163.31V208a16,16,0,0,0,16,16H92.69A15.86,15.86,0,0,0,104,219.31L227.31,96a16,16,0,0,0,0-22.63ZM92.69,208H48V163.31l88-88L180.69,120ZM192,108.68,147.31,64l24-24L216,84.68Z"></path>
      </svg>
      <span>Edit</span>
    </button>

    <div id="root" class="root borderFatSolidGreen transparent"></div>
    <div id="editor-root" class="editor-container-hidden borderDashedPurple transparent"></div>

    <!-- Draggable divider between the output and the editor pane. Hidden until
         edit mode; positioned/shown by applyEditorLayout(). -->
    <div id="editor-resize-handle"></div>

    <script type="module">
      import {
        setHashParamValueBase64EncodedInWindow,
        getHashParamValueBase64DecodedFromUrl,
        getUrlHashParamsFromHashString,
        blobFromBase64String,
        getHashParamValueJsonFromWindow,
        setHashParamValueJsonInHashString,
        setHashParamInWindow,
        getHashParamValueBase64DecodedFromWindow,
        stringFromBase64String
      } from "https://cdn.jsdelivr.net/npm/@metapages/hash-query@0.10.0";
      import {Metapage, Metaframe, isIframe} from "https://cdn.jsdelivr.net/npm/@metapages/metapage@1.10.11";
      // Mermaid's own ESM build, NOT jsdelivr's `/+esm` transform (nor esm.sh).
      // Those re-bundlers duplicate mermaid's internal config module, so
      // `initialize({securityLevel: "loose"})` lands on one copy while the
      // flowchart parser reads another that is still at the default "strict".
      // Its setClickFun() then bails on the securityLevel guard, and `click X
      // handleClick` directives silently never bind — nodes get the "clickable"
      // class but no listener. Keep this URL identical to the one in
      // markdown-plugins/mermaid/index.js so both share one module instance.
      import Mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs';
      import {MermaidPlugIn} from './markdown-plugins/mermaid/index.js';
      import SingleScreenPlugin from './markdown-plugins/single-screen/index.js';
      import markdownAnchor from 'https://cdn.jsdelivr.net/npm/markdown-it-anchor@9.2.0/+esm';

      // export type Options = {
      //   dm?: DisplayMode | undefined;
      //   /**
      //    * Header classnames
      //    */
      //   h?: string;
      // };
      const options = getHashParamValueJsonFromWindow("options") || {};

      const MAX_LOG_ELEMENTS = 1000;
      let logScrollRafPending = false;
      const scheduleLogScroll = (el) => {
        if (logScrollRafPending)
          return;
        logScrollRafPending = true;
        requestAnimationFrame(() => {
          logScrollRafPending = false;
          el.scrollTop = el.scrollHeight;
        });
      };

      const appendLogElement = (s, className) => {
        const root = document.getElementById("root");
        const pre = document.createElement("pre");
        pre.textContent = s;
        pre.className = className;
        root.appendChild(pre);
        while (root.children.length > MAX_LOG_ELEMENTS) {
          root.removeChild(root.firstChild);
        }
        scheduleLogScroll(root);
      };

      globalThis.logStdout = (s) => appendLogElement(s, "pre-stdout");
      globalThis.log = globalThis.logStdout;
      globalThis.logStderr = (s) => appendLogElement(s, "pre-stderr");

      const refreshUpdateSvgButton = () => {
        // only show the edit button if we are NOT in an iframe
        // or explicitly edit=true is in the hash params
        // this will be turned into a configurable option later, but no time rn
        const [_, hashParams] = getUrlHashParamsFromHashString(window.location.hash);
        const inEditMode = hashParams["edit"] === "true";
        if (inEditMode) {
          // do NOT change the visibility of the edit buttons
          return;
        }
        const menuButton = document.getElementById("menu-button");
        if (hashParams["hm"] === "disabled") {
          menuButton.style.display = "none";
        } else {
          menuButton.style.display = "flex";
          if (hashParams["hm"] === "invisible") {
            menuButton
              .classList
              .add("invisible-until-hover");
          } else if (hashParams["hm"] === "visible") {
            menuButton
              .classList
              .remove("invisible-until-hover");
          } else {
            // default is invisible but clickable for iframe apps, and visible for non-iframe apps
            // NOTE: changing this so that the experience is consistent across contexts 10/21/24 CW
            menuButton
              .classList
              .add("invisible-until-hover");
          }
        }
      };

      // Dynamically add <script> and <link> tags to the document.head
      // and listen to the load events
      const ensureModulesLoaded = async () => {
        let modules = getHashParamValueJsonFromWindow("modules");

        // Load a single script, module, or css, awaiting until done
        const loadModuleOrCss = async (s) => {
          return new Promise((resolve, reject) => {

            if (s.startsWith("{")) {
              resolve();
              return;
            }
            let elementTrimmed = s.trim();
            if (elementTrimmed.startsWith("<link")) {
              const href = /<link\s+.*href="([^"]*)"/.exec(elementTrimmed)
                ?.[1];
              if (href) {
                const linkImport = document.createElement("link");
                linkImport.href = href;
                const linkRel = /<link\s+.*rel="([^"]*)"/.exec(elementTrimmed)
                  ?.[1];
                if (linkRel) {
                  linkImport.rel = linkRel;
                }
                const linkType = /<link\s+.*type="([^"]*)"/.exec(elementTrimmed)
                  ?.[1];
                if (linkType) {
                  linkImport.type = linkType;
                }

                const linkCrossorigin = /<link\s+.*crossorigin="([^"]*)"/.exec(elementTrimmed)
                  ?.[1];
                if (linkCrossorigin) {
                  linkImport.crossorigin = linkCrossorigin;
                }

                linkImport.addEventListener("load", () => {
                  resolve();
                });
                linkImport.addEventListener("error", (err) => {
                  console.log("Error loading link", elementTrimmed);
                  window.logStderr(`error loading script: ${elementTrimmed} error: ${err}`);
                  reject(err);
                });

                document
                  .getElementsByTagName("head")[0]
                  .appendChild(linkImport);
              }
            } else {
              resolve();
            }
          });
        };

        if (modules) {
          for (let scriptOrCss of modules) {
            try {
              await loadModuleOrCss(scriptOrCss);
            } catch (error) {
              console.error(error);
            }
          }
        }
      };

      const modulesLoadingPromise = ensureModulesLoaded();

      window.__metaframeMdAwaiting = [modulesLoadingPromise];

      const getMdFromUrl = () => {
        let mdFromUrl = getHashParamValueBase64DecodedFromWindow("md");

        // expecting js code via hash params, but that fails to embed in some places e.g. notion
        // so also allow js from query params if none in hash params
        if (!mdFromUrl) {
          mdFromUrl = new URL(window.location.href)
            .searchParams
            .get("md");
          if (mdFromUrl) {
            mdFromUrl = stringFromBase64String(mdFromUrl);
          }
        }

        return mdFromUrl;
      };

      const setMdInUrl = (m) => {
        setHashParamValueBase64EncodedInWindow("md", m);
      };

      // The id used to tag the injected <style>/<link> so we can find/replace/
      // remove it when the `css` hash param changes.
      const CSS_HASH_PARAM_ELEMENT_ID = "mtfm-css-hash-param";

      // A decoded value is treated as a stylesheet URL (injected as <link>) when
      // it is a single-line http(s) URL; otherwise it is raw CSS text (<style>).
      const isCssStylesheetUrl = (value) => {
        const trimmed = value.trim();
        return /^https?:\/\/\S+$/.test(trimmed) && !/\s/.test(trimmed);
      };

      // Loads a global stylesheet from the transient `css` hash param. The value
      // is base64-encoded and is either raw CSS text or a URL to a stylesheet.
      //
      // This param is intentionally NOT in the canonical/allowed hash param
      // lists, so it is never persisted into the metaframe definition or copied
      // external links. It is appended at runtime to restyle the rendered
      // markdown without modifying its content.
      const applyCssFromUrl = () => {
        // Always remove any previously injected element first so changing or
        // clearing the param fully replaces the prior stylesheet.
        document
          .getElementById(CSS_HASH_PARAM_ELEMENT_ID)
          ?.remove();

        const css = getHashParamValueBase64DecodedFromWindow("css");
        if (!css)
          return;

        let element;
        if (isCssStylesheetUrl(css)) {
          element = document.createElement("link");
          element.rel = "stylesheet";
          element.href = css.trim();
        } else {
          element = document.createElement("style");
          element.textContent = css;
        }
        element.id = CSS_HASH_PARAM_ELEMENT_ID;
        document
          .head
          .appendChild(element);
      };

      // Resolve the effective editor width from the parsed hash params, applying
      // the "80ch" default and the bare-number -> ch coercion.
      const getEditorWidthFromParams = (hashParams) => {
        let editorWidth = hashParams["editorWidth"] || "80ch";
        // If the last character is a number, assume 'ch' units.
        if (/\d$/.test(editorWidth)) {
          editorWidth = `${editorWidth}ch`;
        }
        return editorWidth;
      };

      // Apply the output/editor split widths and position the resize handle.
      // Pure layout: safe to call on any hashchange without re-rendering.
      const applyEditorLayout = () => {
        const [, hashParams] = getUrlHashParamsFromHashString(window.location.hash);
        const inEditMode = hashParams["edit"] === "true";
        const editorWidth = getEditorWidthFromParams(hashParams);

        const root = document.getElementById("root");
        const editor = document.getElementById("editor-root");
        const handle = document.getElementById("editor-resize-handle");

        root.style.width = inEditMode
          ? `calc(100% - ${editorWidth})`
          : "100%";
        editor.style.width = inEditMode
          ? `${editorWidth}`
          : "0%";
        if (handle) {
          if (inEditMode) {
            handle.style.right = editorWidth;
            handle.style.display = "block";
          } else {
            handle.style.display = "none";
          }
        }
      };

      // Wire up drag-to-resize on the divider. The editor pane is pinned to the
      // right edge, so its width is (viewport width - pointer x). Live updates
      // are written straight to the inline styles for smoothness; the final width
      // is persisted to the `editorWidth` hash param on release.
      const setupEditorResizeHandle = () => {
        const handle = document.getElementById("editor-resize-handle");
        if (!handle)
          return;

        const MIN_WIDTH_PX = 120;

        const widthFromPointer = (clientX) => {
          const max = window.innerWidth - 80; // always leave some output visible
          const px = window.innerWidth - clientX;
          return Math.max(MIN_WIDTH_PX, Math.min(max, px));
        };

        const applyWidthPx = (px) => {
          const root = document.getElementById("root");
          const editor = document.getElementById("editor-root");
          root.style.width = `calc(100% - ${px}px)`;
          editor.style.width = `${px}px`;
          handle.style.right = `${px}px`;
        };

        const onMove = (e) => {
          e.preventDefault();
          applyWidthPx(widthFromPointer(e.clientX));
        };

        const onUp = (e) => {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          document
            .body
            .classList
            .remove("resizing");
          handle
            .classList
            .remove("dragging");
          const px = widthFromPointer(e.clientX);
          applyWidthPx(px);
          // Persist. Uses a 'px' suffix so the value is not re-coerced to 'ch'.
          setHashParamInWindow("editorWidth", `${Math.round(px)}px`);
        };

        handle.addEventListener("mousedown", (e) => {
          // Only the primary button starts a resize.
          if (e.button !== 0)
            return;
          e.preventDefault();
          document
            .body
            .classList
            .add("resizing");
          handle
            .classList
            .add("dragging");
          document.addEventListener("mousemove", onMove);
          document.addEventListener("mouseup", onUp);
        });
      };
      setupEditorResizeHandle();

      // Markdown derived from the `mermaid`/`mermaid-base64` inputs. This is
      // transient piped content, so unlike the `md` input it is deliberately NOT
      // written to the url hash: the diagram is regenerated by the upstream
      // metaframe on every connect, and persisting it would both bloat the url
      // and leave a stale diagram behind after disconnecting.
      let _mermaidMarkdown = null;

      const runmdFromUrl = async () => {
        // A live mermaid input wins over the hash. It has no hash representation,
        // so neither the initial "load" render nor a later hashchange (e.g. the
        // `edit`/`editorWidth` params changing) may blank it out.
        if (_mermaidMarkdown !== null) {
          await runOnMarkdown(_mermaidMarkdown);
          return;
        }
        let mdContent = getMdFromUrl();
        await runOnMarkdown(mdContent);
      }

      // Wrap a bare mermaid graph definition so the markdown-it mermaid plugin
      // picks it up as a diagram fence. Empty/absent means "no mermaid input".
      const mermaidToMarkdown = (diagram) => diagram
        ? "```mermaid\n" + diagram + "\n```"
        : null;

      const mermaidBase64ToMarkdown = (b64) => {
        if (!b64) {
          return null;
        }
        try {
          return mermaidToMarkdown(stringFromBase64String(b64));
        } catch (err) {
          return `# Error decoding base64 metaframe input\n\n - key: \`mermaid-base64\`\n - value: ${b64}\n - err: ${err}`;
        }
      };

      let _lastMdContent = null;
      // Renders are serialized. Mermaid.run() scans and mutates the container it
      // finds in the live document, so two overlapping renders race: the second
      // clears #root while the first is still rendering into it, and mermaid
      // finishes by writing an svg that holds only its <style> and no diagram.
      let _renderChain = Promise.resolve();

      const runOnMarkdown = (mdContent) => {
        // Claim the content synchronously. renderMarkdown awaits module loading
        // before it could do this itself, which is long enough for two callers
        // with identical content (the "load" handler and an arriving `md`/
        // `mermaid` input) to both get past the check and render twice.
        const isNewContent = _lastMdContent !== mdContent;
        if (isNewContent) {
          _lastMdContent = mdContent;
        }
        _renderChain = _renderChain
          .then(() => renderMarkdown(mdContent, isNewContent))
          .catch((err) => console.error(err));
        return _renderChain;
      };

      // `isNewContent` false still re-applies layout/background: hashchange fires
      // for `edit`/`editorWidth`/`bgColor` without the markdown itself changing.
      const renderMarkdown = async (mdContent, isNewContent) => {

        // ensure all modules are loaded
        await Promise.all(window.__metaframeMdAwaiting);

        const [___, hashParamsCurrent] = getUrlHashParamsFromHashString(window.location.hash);
        const inEditMode = hashParamsCurrent["edit"] === "true";
        const defaultBgColor = hashParamsCurrent["bgColor"];
        if (!inEditMode) {
          removeEditor();
        }
        // set up (maybe re-override globals)
        const root = document.getElementById("root");
        if (defaultBgColor) {
          root.style.background = defaultBgColor;
        }

        // Apply the output/editor split widths (also positions the resize handle).
        applyEditorLayout();

        if (!isNewContent) {
          return;
        }

        // clear all children of root
        document
          .getElementById("root")
          .textContent = "";

        // let mdContent = getMdFromUrl();

        const metaframe = globalThis.metaframe;
        // prettier-ignore
        metaframe
          ?.setOutput("md", mdContent);

        const MD = markdownit({html: true, linkify: true, typographer: true});
        MD.use(MermaidPlugIn);
        MD.use(SingleScreenPlugin, options || {});
        MD.use(markdownAnchor, {
          level: [1, 2, 3]
        });

        const rules = options
          ?.dm === 'slide'
            ? {

              table_close: () => '</table>\n</div>\n</div>',
              table_open: () => '<div class="row"><div class="rowCellTable">\n<table>\n'
            }
            : {};

        MD.renderer.rules = {
          ...MD.renderer.rules,
          ...rules
        };

        try {
          var result = MD.render(mdContent);
          root.innerHTML = result;
          // Awaited so the next queued render cannot start mid-diagram.
          await Mermaid.run();
        } catch (err) {
          console.error(err);
          var result = MD.render(`# Error rendering markdown \n\n - markdown: \`${mdContent}\` \n - err: ${err}`);
          root.innerHTML = result;
        }
      }

      // Examine URL, and add modules
      globalThis.metapage = {
        Metapage,
        Metaframe
      };

      if (!globalThis.metaframe) {
        globalThis.metaframe = new Metaframe();
      }
      var metaframe = globalThis.metaframe;

      // Mermaid `click <node> handleClick` directives (enabled by the plugin's
      // securityLevel: "loose") call this global with the clicked node id.
      // Forwarding it as the `click` output is what makes piped diagrams
      // clickable, e.g. app.metapage.io's metapage/connections graphs.
      // Must exist before the first Mermaid.run() so the callbacks bind.
      globalThis.handleClick = (nodeClickText) => {
        globalThis
          .metaframe
          ?.setOutput("click", nodeClickText);
      };

      metaframe.onInput("md", (md) => {
        if (md) {
          setHashParamValueBase64EncodedInWindow("md", md);
        }
      });

      // A bare mermaid graph definition, rendered as a diagram.
      metaframe.onInput("mermaid", (diagram) => {
        _mermaidMarkdown = mermaidToMarkdown(diagram);
        runmdFromUrl();
      });

      metaframe.onInput("mermaid-base64", (b64) => {
        _mermaidMarkdown = mermaidBase64ToMarkdown(b64);
        runmdFromUrl();
      });

      const initialInputs = metaframe.getInputs();
      initialInputs["md"] && setHashParamValueBase64EncodedInWindow("md", initialInputs["md"]);
      // Inputs already present at construction never fire onInput, so seed from
      // them too. Rendering is driven by the load/hashchange handlers below,
      // which now consult _mermaidMarkdown first.
      _mermaidMarkdown = mermaidToMarkdown(initialInputs["mermaid"]) ||
        mermaidBase64ToMarkdown(initialInputs["mermaid-base64"]);

      metaframe
        .connected()
        .then(() => metaframe.log("connected"));

      // Apply the transient `css` hash param stylesheet on initial load.
      applyCssFromUrl();

      // Handle Safari timing issue: check if the page is already loaded, or the
      // "load" event will have fired before this listener is registered.
      if (document.readyState === "complete") {
        runmdFromUrl();
      } else {
        globalThis.addEventListener("load", runmdFromUrl);
      }

      // reload on hash changes
      globalThis.addEventListener("hashchange", () => {
        // Apply the transient `css` param on every hash change. Re-rendering is
        // skipped by the `_lastMdContent` guard when only the styling changed.
        applyCssFromUrl();
        // Keep the split/handle in sync with `editorWidth` (and edit mode).
        applyEditorLayout();
        runmdFromUrl();
      }, false);

      const metapageDef = {
        metaframes: {
          editor: {
            url: `${window.location.origin}/editor/#?c=eyJtb2R1bGVzIjpbXX0=`
          }
        },
        version: "1"
      };

      const removeEditor = () => {
        if (globalThis.metapageEditor) {
          globalThis
            .metapageEditor
            .dispose();
          globalThis.metapageEditor = null;
        }
        const previousContainer = document.getElementById("iframe-container");
        if (previousContainer) {
          previousContainer
            .parentElement
            .removeChild(previousContainer);
        }
        refreshUpdateSvgButton();

        setHashParamInWindow("edit", undefined);
        document
          .getElementById("root")
          .className = "root borderFatSolidGreen";
        document
          .getElementById("editor-root")
          .className = "editor-container-hidden borderDashedBlue";
        const resizeHandle = document.getElementById("editor-resize-handle");
        if (resizeHandle) {
          resizeHandle.style.display = "none";
        }
      };

      const onMenuClick = async () => {
        // if there is an existing editor, remove it, then exit
        if (document.getElementById("iframe-container")) {
          removeEditor();
          runmdFromUrl();
          return;
        }
        setHashParamInWindow("edit", true);

        document
          .getElementById("menu-button")
          .style
          .display = "none";

        // no previous editor detected, add the editor metapage
        // listen to the editor metapage for changes to the editor url hash
        // and make that our own url hash
        document
          .getElementById("root")
          .className = "root-with-editor borderFatSolidGreen";

        document
          .getElementById("editor-root")
          .className = "editor-container-shown borderDashedBlue";

        // Modify the metapage editor url hash to our own
        const editorUrl = new URL(metapageDef.metaframes.editor.url);
        editorUrl.hash = window.location.hash;
        metapageDef.metaframes.editor.url = editorUrl.href;

        const mp = await globalThis
          .metapage
          .Metapage
          .from(metapageDef);
        globalThis.metapageEditor = mp;
        const editorMetaframe = mp.getMetaframe("editor");
        const iframe = await editorMetaframe.iframe;

        var iframeDivContainer = document.createElement("div");
        iframeDivContainer.id = "iframe-container";
        iframeDivContainer.className = "iframe-container";
        iframeDivContainer.appendChild(iframe);

        document
          .getElementById("editor-root")
          .append(iframeDivContainer);
        runmdFromUrl();

        let pending;
        const updateCode = (hash) => {
          if (pending) {
            clearTimeout(pending);
          }
          pending = setTimeout(() => {
            pending = null;
            window.location.hash = hash;
          }, 200);
        };
        mp.addListener(globalThis.metapage.Metapage.DEFINITION, (event) => {
          const url = event
            ?.definition
              ?.metaframes
                ?.editor
                  ?.url;
          if (url) {
            const urlBlob = new URL(url);
            updateCode(urlBlob.hash);
          }
        });
      };

      document
        .getElementById("menu-button")
        .addEventListener("click", onMenuClick);

      refreshUpdateSvgButton();

      const [_, hashParamOnce] = getUrlHashParamsFromHashString(window.location.hash);
      const inEditModeOnce = hashParamOnce["edit"] === "true";
      if (inEditModeOnce) {
        // if editing, force showing the menu.
        // Same Safari timing issue as above: "load" may already have fired.
        if (document.readyState === "complete") {
          onMenuClick();
        } else {
          window.addEventListener("load", () => {
            onMenuClick();
          });
        }
      }
    </script>
  </body>

</html>
